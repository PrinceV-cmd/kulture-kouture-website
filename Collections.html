<!DOCTYPE html>
<!--
  Kulture Kouture — Collections page
  Shows product categories and featured products (populated by script.js).
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <title>Kulture Kouture - Collections</title>
</head>

<body>
    <div class="container">
        <!-- Main navigation bar -->
        <div class="navbar">
            <a href="index.html">
                <div class="logo"></div>
            </a>
            <button class="nav-toggle" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="primary-navigation">
                <i class="fa fa-bars"></i>
            </button>
            <nav id="primary-navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Catalog</a></li>
                    <li><a href="Collections.html">Collections</a></li>
                    <li><a href="roadmap.html">RoadMap</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>

        <!-- Announcement ticker (CSS animation, screenreader-friendly) -->
        <div class="marquee" role="region" aria-label="Announcements">
            <div class="marquee__text"><a href="events.html">Upcoming Events: Grand Opening Sale!</a></div>
        </div>
        <!-- Hero/header banner -->
        <header class="header"></header>

        <!-- Categories grid populated by script.js -->
        <section>
            <h2>Categories</h2>
            <div id="categories" class="grid"></div>
        </section>

        <!-- Featured products grid populated by script.js -->
        <section>
            <h2>Featured Products</h2>
            <div id="featured" class="grid"></div>
        </section>

        <!-- Footer with quick brand and support references -->
        <footer>

            <div class="footer">

                <div>
                    <h3>Shop</h3>
                    <a href="index.html">
                        <p>Catalog</p>
                    </a>
                    <a href="Collections.html">
                        <p>Collections</p>
                    </a>
                    <a href="products.html">
                        <p>Available Products</p>
                    </a>
                </div>

                <div>
                    <h3>The Brand</h3>
                    <a href="roadmap.html">
                        <p>Roadmap</p>
                    </a>
                    <a href="products.html">
                        <p>Featured Products</p>
                    </a>
                </div>

                <div>
                    <h3>Support</h3>
                    <a href="contact.html">
                        <p>Contact Us</p>
                    </a>
                    <a href="contact.html">
                        <p>Customer Reviews</p>
                    </a>
                </div>

            </div>

            <p class="copy">2026 © Kulture Kouture</p>

        </footer>

    </div>

    <!-- Shared script populates the collections page grids -->
    <script>

        // Category data used on the homepage
        const categories = [
            { name: "Ankara", image: "Asset/Images/Category.JPG" },
            { name: "Native Wear", image: "Asset/Images/Category 2.JPG" },
            { name: "Evening Dress", image: "Asset/Images/Category 3.JPG" }
        ];

        // Featured products data (homepage) 
        const featured = [
            { name: "Royal Blue Gown", price: "$180", image: "Asset/Images/Product 3.JPG" },
            { name: "Red Cultural Dress", price: "$150", image: "Asset/Images/Featured 1.JPG" },
            { name: "Elegant Ankara", price: "$200", image: "Asset/Images/Product 5.JPG" }
        ];

        // Render category cards in the Categories section
        const catContainer = document.getElementById("categories");
        categories.forEach(c => {
            // Build a simple card for each category item
            let card = document.createElement("div");
            card.innerHTML = `<img src="${c.image}"><p>${c.name}</p>`;
            catContainer.appendChild(card);
        });

        // Render featured product cards in the Featured Products section
        const featContainer = document.getElementById("featured");
        featured.forEach(p => {
            // Each featured card shows product image, name, and price
            let card = document.createElement("div");
            card.innerHTML = `<img src="${p.image}"><h3>${p.name}</h3><p>${p.price}</p>`;
            featContainer.appendChild(card);
        });

        // Mobile nav toggle for all pages

        function toggleNav() {
            const navLinks = document.querySelector('.nav-links');
            const toggle = document.querySelector('.nav-toggle');
            if (!navLinks || !toggle) return;
            const isOpen = navLinks.classList.toggle('open');
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }

            const toggle = document.querySelector('.nav-toggle');
            if (toggle) {
                toggle.addEventListener('click', toggleNav);
            }
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    const navLinks = document.querySelector('.nav-links');
                    const toggle = document.querySelector('.nav-toggle');
                    if (navLinks && navLinks.classList.contains('open')) {
                        navLinks.classList.remove('open');
                        if (toggle) toggle.setAttribute('aria-expanded', 'false');
                    }
                });
            });

    </script>


</body>

</html>
